server {
    listen 80;
    
    # 1. Sirve la página de React correctamente
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Inverso: Manda todo lo que diga /api al Backend
    location /api/ {
        proxy_pass http://cybersoc_api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}